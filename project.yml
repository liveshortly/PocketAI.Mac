name: PocketAI
options:
  bundleIdPrefix: com.getpocketai
packages:
  PocketCore:
    path: ../PocketAI.Core
targets:
  PocketAI:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources: [Sources]
    scheme:
      testTargets:
        - PocketAITests
    dependencies:
      - package: PocketCore
        product: PocketKit
      - package: PocketCore
        product: PocketUI
      - package: PocketCore
        product: PocketMLX
      - package: PocketCore
        product: PocketImageGen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: Entitlements/PocketAI.entitlements
    info:
      path: Sources/Info.plist
      properties:
        NSLocalNetworkUsageDescription: "PocketAI lets your paired iPhone use this Mac's models."
        NSBonjourServices:
          - _pocketai._tcp
        NSMicrophoneUsageDescription: "PocketAI uses the microphone for voice input."
        NSSpeechRecognitionUsageDescription: "PocketAI transcribes your voice on-device for voice input."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - pocketai
            CFBundleURLName: app.getpocketai.pocketai

  PocketAITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources: [Tests]
    dependencies:
      - target: PocketAI
      - package: PocketCore
        product: PocketKit
      - package: PocketCore
        product: PocketUI
      - package: PocketCore
        product: PocketImageGen
      - package: PocketCore
        product: PocketMLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app.tests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: PocketAI
