name: PocketAI
options:
  bundleIdPrefix: com.getpocketai
  developmentLanguage: en
  # Locales the app ships. Translations live in
  # Resources/Localizable.xcstrings; shared components come localized from
  # PocketUI's own catalog.
  knownRegions: [en, hi, es, fr, de, ja, zh-Hans, pt-BR, Base]
# Apple Silicon only, declared rather than discovered. The app runs MLX
# models, which need a Metal GPU on Apple Silicon, and the Rust core ships a
# macos-arm64 slice alone. A plain `xcodebuild archive` targets universal and
# fails at the x86_64 link step with nothing obviously wrong — this makes the
# real constraint explicit.
settings:
  base:
    ARCHS: arm64
    VALID_ARCHS: arm64
    # Notarization refuses a binary without it: "The executable does not have
    # the hardened runtime enabled." Required for any Developer ID build.
    ENABLE_HARDENED_RUNTIME: YES
packages:
  PocketCore:
    path: ../PocketAI.Core
  # Sparkle 2 for direct (non-App-Store) auto-update. Pinned exactly, like
  # every other dependency here.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.6.4
targets:
  PocketAI:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
      - path: Resources/Localizable.xcstrings
    scheme:
      testTargets:
        - PocketAITests
        - PocketAIUITests
    dependencies:
      - package: PocketCore
        product: PocketKit
      - package: PocketCore
        product: PocketUI
      - package: PocketCore
        product: PocketMLX
      - package: PocketCore
        product: PocketImageGen
      - package: PocketCore
        product: PocketLiveShortly
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: Entitlements/PocketAI.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        # Bumped every release; the notarized DMG is named after it.
        CFBundleVersion: "24"
        CFBundleLocalizations: [en, hi, es, fr, de, ja, zh-Hans, pt-BR]
        NSLocalNetworkUsageDescription: "PocketAI lets your paired iPhone use this Mac's models."
        NSBonjourServices:
          - _pocketai._tcp
        NSMicrophoneUsageDescription: "PocketAI uses the microphone for voice input."
        NSSpeechRecognitionUsageDescription: "PocketAI transcribes your voice on-device for voice input."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - pocketai
            CFBundleURLName: app.getpocketai.pocketai
        # Sparkle auto-update. Both are read from the built bundle at launch.
        #
        # SUFeedURL and SUPublicEDKey are deliberately EMPTY here: the appcast
        # has nowhere to live yet, and the EdDSA public key does not exist
        # until someone runs `generate_keys` (its private half goes in the
        # login keychain and must never reach this repo). Updater.swift treats
        # an empty feed as "no updater configured" and disables the menu item,
        # so an unconfigured build is honest rather than broken. Filling these
        # two values in is the whole remaining step — see
        # scripts/make-appcast.sh.
        SUFeedURL: ""
        SUPublicEDKey: ""
        # Checked daily, and only ever offered — never installed silently.
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false

  PocketAITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Tests]
    dependencies:
      - target: PocketAI
      - package: PocketCore
        product: PocketKit
      - package: PocketCore
        product: PocketUI
      - package: PocketCore
        product: PocketImageGen
      - package: PocketCore
        product: PocketMLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app.tests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: PocketAI

  PocketAIUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources: [UITests]
    dependencies:
      - target: PocketAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app.uitests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PocketAI
