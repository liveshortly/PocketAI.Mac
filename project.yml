name: PocketAI
options:
  bundleIdPrefix: com.getpocketai
settings:
  base:
    # The macOS slice of pocket_ffiFFI.xcframework is arm64-only; Release
    # otherwise also builds x86_64 and fails to link.
    ARCHS: arm64
packages:
  PocketCore:
    path: ../PocketAI.Core
targets:
  PocketAI:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources: [Sources]
    scheme:
      testTargets:
        - PocketAITests
        - PocketAIUITests
    dependencies:
      - package: PocketCore
        product: PocketKit
      - package: PocketCore
        product: PocketUI
      - package: PocketCore
        product: PocketMLX
      - package: PocketCore
        product: PocketImageGen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: Entitlements/PocketAI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        NSLocalNetworkUsageDescription: "PocketAI lets your paired iPhone use this Mac's models."
        NSBonjourServices:
          - _pocketai._tcp
        NSMicrophoneUsageDescription: "PocketAI uses the microphone for voice input."
        NSSpeechRecognitionUsageDescription: "PocketAI transcribes your voice on-device for voice input."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - pocketai
            CFBundleURLName: app.getpocketai.pocketai

  PocketAITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources: [Tests]
    dependencies:
      - target: PocketAI
      - package: PocketCore
        product: PocketKit
      - package: PocketCore
        product: PocketUI
      - package: PocketCore
        product: PocketImageGen
      - package: PocketCore
        product: PocketMLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app.tests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: PocketAI

  PocketAIUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources: [UITests]
    dependencies:
      - target: PocketAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app.uitests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PocketAI
