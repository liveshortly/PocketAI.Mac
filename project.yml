name: PocketAI
options:
  bundleIdPrefix: com.getpocketai
  developmentLanguage: en
  # Locales the app ships. Translations live in
  # Resources/Localizable.xcstrings; shared components come localized from
  # PocketUI's own catalog.
  knownRegions: [en, hi, es, fr, de, ja, zh-Hans, pt-BR, Base]
packages:
  PocketCore:
    path: ../PocketAI.Core
targets:
  PocketAI:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
      - path: Resources/Localizable.xcstrings
    scheme:
      testTargets:
        - PocketAITests
        - PocketAIUITests
    dependencies:
      - package: PocketCore
        product: PocketKit
      - package: PocketCore
        product: PocketUI
      - package: PocketCore
        product: PocketMLX
      - package: PocketCore
        product: PocketImageGen
      - package: PocketCore
        product: PocketLiveShortly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: Entitlements/PocketAI.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: Sources/Info.plist
      properties:
        CFBundleLocalizations: [en, hi, es, fr, de, ja, zh-Hans, pt-BR]
        NSLocalNetworkUsageDescription: "PocketAI lets your paired iPhone use this Mac's models."
        NSBonjourServices:
          - _pocketai._tcp
        NSMicrophoneUsageDescription: "PocketAI uses the microphone for voice input."
        NSSpeechRecognitionUsageDescription: "PocketAI transcribes your voice on-device for voice input."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - pocketai
            CFBundleURLName: app.getpocketai.pocketai

  PocketAITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Tests]
    dependencies:
      - target: PocketAI
      - package: PocketCore
        product: PocketKit
      - package: PocketCore
        product: PocketUI
      - package: PocketCore
        product: PocketImageGen
      - package: PocketCore
        product: PocketMLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app.tests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: PocketAI

  PocketAIUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources: [UITests]
    dependencies:
      - target: PocketAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app.uitests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PocketAI
